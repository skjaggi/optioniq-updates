<script>
// TEST COPY: keeps its own settings and sign-in, apart from the everyday app
// at /phone/ on the same site, so it can never pick up your real folder.
(function () { var P = "oiqtest:", S = Storage.prototype, g = S.getItem, s = S.setItem, r = S.removeItem;
  S.getItem = function (k) { return g.call(this, P + k); };
  S.setItem = function (k, v) { return s.call(this, P + k, v); };
  S.removeItem = function (k) { return r.call(this, P + k); }; })();
</script>
